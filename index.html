<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Ccircle cx='17' cy='17' r='16' fill='%23f7931e' stroke='%23fff' stroke-width='2'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='1.6'%3E%3Ccircle cx='17' cy='17' r='9'/%3E%3Cellipse cx='17' cy='17' rx='4' ry='9'/%3E%3Cpath d='M8 17h18'/%3E%3C/g%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: #0b66c9; color: #fff; font: 14px/1.4 Roboto, Arial, Helvetica, sans-serif; position: relative; overflow-x: hidden; }
  a { color: #cfe3f8; text-decoration: none; }
  a:hover { color: #fff; text-decoration: underline; }
  .bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .page { position: relative; max-width: 760px; margin: 0 auto; padding: 36px 15px 30px; text-align: center; }

  .brand { display: inline-flex; align-items: center; }
  .brand svg { width: 34px; height: 34px; margin-right: 10px; flex: none; }
  .brand h1 { margin: 0; font-size: 26px; font-weight: bold; word-break: break-all; }
  .sale { margin: 8px 0 14px; font-size: 12px; color: #dcebfa; }
  .sale b { color: #fff; }
  .btn-buy { display: inline-block; padding: 8px 22px; background: #0aa755; border: 1px solid #08914a; border-radius: 2px; color: #fff; font-weight: bold; font-size: 13px; }
  .btn-buy:hover { background: #08914a; color: #fff; text-decoration: none; }

  .box { width: 100%; max-width: 360px; margin: 34px auto 0; background: #f2f2f2; color: #333; border-radius: 2px; padding: 22px 28px 26px; text-align: left; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .box h2 { margin: 0 0 14px; font-size: 13px; font-weight: bold; color: #222; }
  .box input[type=text], .box input[type=email], .box textarea { display: block; width: 100%; margin-bottom: 8px; padding: 8px 9px; border: 1px solid #e0e0e0; border-radius: 2px; background: #fff; font: 12px Roboto, Arial, sans-serif; color: #333; }
  .box textarea { height: 78px; resize: vertical; }
  .box input:focus, .box textarea:focus { outline: none; border-color: #2e8bd6; }

  .captcha { margin: 10px 0 12px; min-height: 78px; }

  .send { display: block; width: 100%; padding: 10px; background: #0aa755; border: 1px solid #08914a; border-radius: 2px; color: #fff; font: bold 13px Roboto, Arial, sans-serif; cursor: pointer; }
  .send:hover { background: #08914a; }
  .err { display: none; margin-bottom: 10px; padding: 6px 8px; background: #fbeaea; border: 1px solid #e8b4b4; color: #a33; font-size: 12px; }

  .foot { position: relative; margin-top: 28px; font-size: 11px; color: #a9c9ec; }
  .foot a { margin: 0 6px; }
</style>
</head>
<body>

<svg class="bg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 800 520">
  <g fill="none" stroke="#2f80d9" stroke-width="1" opacity=".7">
    <path d="M-20 440 C 200 300, 400 520, 820 330" stroke-dasharray="4 5"/>
    <rect x="20" y="170" width="150" height="110" transform="rotate(-8 95 225)"/>
    <rect x="40" y="190" width="150" height="110" transform="rotate(-8 115 245)"/>
    <rect x="630" y="180" width="120" height="90" transform="rotate(6 690 225)"/>
  </g>
  <g fill="#2f80d9" opacity=".7">
    <circle cx="90" cy="70" r="3"/><circle cx="700" cy="60" r="3"/><circle cx="740" cy="120" r="2"/>
    <circle cx="40" cy="120" r="2"/><circle cx="560" cy="40" r="2"/><circle cx="250" cy="30" r="2"/>
  </g>
  <circle cx="720" cy="420" r="70" fill="#1c8a5a" opacity=".85"/>
  <circle cx="80" cy="470" r="60" fill="#0f4f9e" opacity=".8"/>
</svg>

<div class="page">
  <div class="brand">
    <svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="16" fill="#f7931e" stroke="#fff" stroke-width="2"/><g fill="none" stroke="#fff" stroke-width="1.6"><circle cx="17" cy="17" r="9"/><ellipse cx="17" cy="17" rx="4" ry="9"/><path d="M8 17h18"/></g></svg>
    <h1>iwsydt.company</h1>
  </div>
  <div class="sale">Этот домен продаётся за <b>1280 ᵴ</b></div>
  <a class="btn-buy" href="http://gadichdmn.gd/registration">Купить</a>

  <form class="box" id="f" method="post" action="http://gadichdmn.gd/contact" novalidate>
    <h2>Написать администратору домена</h2>
    <div class="err" id="err"></div>
    <input type="text" name="name" id="name" placeholder="Ваше имя" maxlength="80">
    <input type="email" name="email" id="email" placeholder="Ваша электронная почта" maxlength="120">
    <textarea name="message" id="msg" placeholder="Сообщение" maxlength="2000"></textarea>

    <div class="captcha"><div class="g-recaptcha" data-sitekey="6LeTiQ4uAAAAAJK70aPH04y4-jIRCQhVrBfblObB"></div></div>

    <button class="send" type="submit">Отправить</button>
  </form>

  <div class="foot">
    <a href="http://gadichdmn.gd/">gadichdmn.gd</a> |
    <a href="http://gadichdmn.gd/terms">Условия использования</a> |
    <a href="http://gadichdmn.gd/privacy">Политика конфиденциальности</a> |
    <a href="http://gadichdmn.gd/contact">Контакты</a>
  </div>
</div>

<script src="https://www.google.com/recaptcha/api.js?hl=ru" async defer></script>
<script>
  // Проверка формы только на клиенте; сама отправка идёт на gadichdmn.gd (сервис закрыт).
  var $ = function (id) { return document.getElementById(id); };
  $('f').onsubmit = function (e) {
    var msg = '', ok = window.grecaptcha && grecaptcha.getResponse();
    if (!$('name').value.replace(/\s/g, '')) msg = 'Укажите ваше имя.';
    else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test($('email').value)) msg = 'Укажите корректный адрес электронной почты.';
    else if (!$('msg').value.replace(/\s/g, '')) msg = 'Введите сообщение.';
    else if (!ok) msg = 'Подтвердите, что вы не робот.';
    if (msg) { e.preventDefault(); $('err').textContent = msg; $('err').style.display = 'block'; return false; }
  };
</script>
</body>
</html>
